<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEMCoin (MEM) — курс</title>
<style>
body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
.card { border: 1px solid #ddd; border-radius: 12px; padding: 24px; }
.price { font-size: 42px; font-weight: bold; }
.muted { color: #666; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
<h1>MEMCoin (MEM)</h1>
<div class="price" id="price">загрузка...</div>
<div id="details" class="muted"></div>
<p class="muted">Контракт BSC: <a href="https://bscscan.com/address/0x023E00a1b6aD9E2209167b433a0Bb65Be6B751D4" target="_blank">0x023E...751D4</a></p>
<p class="muted">Обновлено: <span id="updated">-</span> (автообновление GitHub Actions каждые 5 минут)</p>
</div>
<script>
fetch('data/price.json').then(r => r.json()).then(d => {
  document.getElementById('price').textContent = d.priceUsd ? '$' + d.priceUsd : 'нет ликвидности';
  document.getElementById('updated').textContent = d.updatedAt || '-';
  document.getElementById('details').innerHTML =
    'TotalSupply: ' + (d.totalSupply || '10 000 000 MEM') + '<br>' +
    'BNB: $' + (d.bnbUsd || '-') + '<br>' +
    (d.pairUrl ? '<a href="' + d.pairUrl + '" target="_blank">Пара на DEX</a>' : 'Добавь ликвидность на PancakeSwap, чтобы появился курс');
});
</script>
</body>
</html>
